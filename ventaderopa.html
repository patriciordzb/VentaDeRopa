<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captura rápida — Tienda de ropa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.0.11/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#c9ad7a;
    --bg-2:#bfa06c;
    --card:#faf3e4;
    --ink:#241c12;
    --muted:#8a765a;
    --stamp-blue:#2c4a6e;
    --stamp-blue-dark:#1c3450;
    --price-red:#b8402a;
    --paid-green:#3e6b4f;
    --line:#b79f72;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:
      radial-gradient(circle at 20% 10%, rgba(0,0,0,.05) 0, transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(0,0,0,.05) 0, transparent 40%),
      linear-gradient(var(--bg), var(--bg-2));
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px 60px;
  }
  .scene{
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:420px;
  }
  .string{
    width:2px;
    height:26px;
    background:var(--muted);
  }
  .tag-card{
    position:relative;
    width:100%;
    background:var(--card);
    border-radius:18px;
    box-shadow:0 18px 40px rgba(30,20,5,.28), 0 2px 0 rgba(255,255,255,.4) inset;
    padding:28px 22px 24px;
    border:1px solid rgba(0,0,0,.06);
  }
  .hole{
    position:absolute;
    top:-13px;
    left:50%;
    transform:translateX(-50%);
    width:22px;
    height:22px;
    border-radius:50%;
    background:var(--bg);
    box-shadow:inset 0 2px 4px rgba(0,0,0,.35);
  }
  .tag-header{text-align:left;margin-bottom:14px;}
  .tag-header h1{
    font-family:'Bebas Neue', sans-serif;
    font-weight:400;
    font-size:34px;
    letter-spacing:.5px;
    margin:0;
    line-height:1;
    color:var(--ink);
  }
  .tag-header .sub{
    margin:4px 0 0;
    font-size:13px;
    color:var(--muted);
  }
  .perforation{
    border-top:2px dashed var(--line);
    margin:16px 0;
  }
  .tabs{
    display:flex;
    gap:8px;
    margin-bottom:18px;
  }
  .tab{
    flex:1;
    font-family:'IBM Plex Sans', sans-serif;
    font-weight:600;
    font-size:14px;
    padding:10px 6px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:transparent;
    color:var(--muted);
    cursor:pointer;
    transition:background .15s ease, color .15s ease, border-color .15s ease;
  }
  .tab.active{
    background:var(--stamp-blue);
    border-color:var(--stamp-blue);
    color:#fff;
  }
  .tab:focus-visible, input:focus-visible, select:focus-visible, button:focus-visible{
    outline:3px solid var(--price-red);
    outline-offset:2px;
  }
  .panel.hidden{display:none;}
  label{
    display:block;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin-bottom:14px;
  }
  .sku-row{display:flex; gap:8px; margin-top:6px;}
  input[type="text"], input[type="number"], select{
    width:100%;
    margin-top:6px;
    padding:12px 12px;
    font-size:16px;
    font-family:'IBM Plex Sans', sans-serif;
    color:var(--ink);
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
  }
  .sku-row input{margin-top:0;}
  .scan-btn{
    flex:0 0 48px;
    border-radius:10px;
    border:1.5px solid var(--line);
    background:#fff;
    font-size:20px;
    cursor:pointer;
  }
  .stamp-btn{
    width:100%;
    margin-top:6px;
    padding:15px;
    font-family:'Bebas Neue', sans-serif;
    font-size:20px;
    letter-spacing:1px;
    color:#fff;
    background:var(--stamp-blue);
    border:none;
    border-radius:12px;
    cursor:pointer;
    transition:transform .08s ease, background .15s ease;
  }
  .stamp-btn:active{transform:scale(.97); background:var(--stamp-blue-dark);}
  .stamp-btn:disabled{opacity:.6; cursor:wait;}
  #panel-gasto .stamp-btn{background:var(--price-red);}
  #panel-gasto .stamp-btn:active{background:#93331f;}

  .scanner-frame{
    position:relative;
    width:100%;
    aspect-ratio:1/1;
    background:#111;
    border-radius:12px;
    overflow:hidden;
  }
  #qr-reader{width:100%; height:100%;}
  #qr-reader video{width:100% !important; height:100% !important; object-fit:cover;}
  .reticle{
    position:absolute;
    inset:18%;
    border:3px solid rgba(255,255,255,.85);
    border-radius:14px;
    pointer-events:none;
    box-shadow:0 0 0 2000px rgba(0,0,0,.28);
  }
  .scan-hint{text-align:center; color:var(--muted); font-size:13px; margin-top:10px;}

  .stamp-overlay{
    position:fixed;
    inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    background:rgba(36,28,18,.55);
    opacity:0;
    pointer-events:none;
    transition:opacity .15s ease;
  }
  .stamp-overlay.show{opacity:1; pointer-events:auto;}
  .stamp-mark{
    width:96px; height:96px;
    border-radius:50%;
    border:5px solid var(--paid-green);
    color:var(--paid-green);
    background:rgba(250,243,228,.95);
    display:flex; align-items:center; justify-content:center;
    font-size:44px;
    transform:scale(0) rotate(-18deg);
  }
  .stamp-overlay.show .stamp-mark{
    animation:stampIn .35s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes stampIn{
    0%{transform:scale(0) rotate(-18deg); opacity:0;}
    60%{transform:scale(1.12) rotate(-4deg); opacity:1;}
    100%{transform:scale(1) rotate(-6deg); opacity:1;}
  }
  .stamp-text{
    font-family:'Bebas Neue', sans-serif;
    font-size:22px;
    letter-spacing:1px;
    color:#fff;
  }
  .config-warning{
    max-width:420px;
    margin:0 auto 14px;
    background:#fff3cd;
    border:1px solid #d9b53c;
    color:#5a4600;
    font-size:12px;
    padding:10px 12px;
    border-radius:10px;
  }
  @media (prefers-reduced-motion: reduce){
    .stamp-btn, .stamp-mark, .tab{transition:none; animation:none;}
  }
</style>
</head>
<body>

<div id="configWarning" class="config-warning" style="display:none">
  ⚠️ Falta configurar <code>APPS_SCRIPT_URL</code> y <code>SECRET</code> arriba en el código de este archivo antes de usarlo.
</div>

<div class="scene">
  <div class="string"></div>
  <div class="tag-card">
    <div class="hole"></div>
    <header class="tag-header">
      <h1>Captura rápida</h1>
      <p class="sub">Ventas · Gastos · Escaneo de producto</p>
    </header>
    <div class="perforation"></div>

    <nav class="tabs">
      <button class="tab active" data-tab="venta" type="button">Venta</button>
      <button class="tab" data-tab="gasto" type="button">Gasto</button>
      <button class="tab" data-tab="scan" type="button">Escanear</button>
    </nav>

    <section class="panel" id="panel-venta">
      <form id="form-venta">
        <label>ID de la prenda
          <div class="sku-row">
            <input type="text" name="sku" id="sku-venta" required placeholder="P-0007 (escanea su etiqueta)">
            <button type="button" class="scan-btn" data-target="sku-venta" aria-label="Escanear etiqueta de la prenda">📷</button>
          </div>
        </label>
        <label>Cantidad
          <input type="number" name="cantidad" min="1" value="1" required>
        </label>
        <label>Precio de venta (MXN)
          <input type="number" name="precio_mxn" min="0" step="0.01" required>
        </label>
        <label>Método de pago
          <select name="metodo_pago">
            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Transferencia</option>
            <option>Depósito</option>
            <option>Otro</option>
          </select>
        </label>
        <label>Cliente (opcional)
          <input type="text" name="cliente" placeholder="">
        </label>
        <input type="hidden" name="tipo" value="venta">
        <input type="hidden" name="secret" class="secret-field" value="">
        <button type="submit" class="stamp-btn">Registrar venta</button>
      </form>
    </section>

    <section class="panel hidden" id="panel-gasto">
      <form id="form-gasto">
        <label>Concepto
          <input type="text" name="concepto" required placeholder="Envío de paquete">
        </label>
        <label>Tipo de gasto
          <select name="tipo_gasto">
            <option>Flete/Envío</option>
            <option>Empaque</option>
            <option>Publicidad</option>
            <option>Comisión de venta</option>
            <option>Renta de puesto/local</option>
            <option>Herramientas/Insumos</option>
            <option>Otro</option>
          </select>
        </label>
        <label>Clasificación
          <select name="clasificacion">
            <option>Variable</option>
            <option>Fijo</option>
          </select>
        </label>
        <label>Moneda
          <select name="moneda">
            <option>MXN</option>
            <option>USD</option>
          </select>
        </label>
        <label>Monto
          <input type="number" name="monto" min="0" step="0.01" required>
        </label>
        <label>Método de pago
          <select name="metodo_pago">
            <option>Efectivo</option>
            <option>Tarjeta</option>
            <option>Transferencia</option>
            <option>Depósito</option>
            <option>Otro</option>
          </select>
        </label>
        <input type="hidden" name="tipo" value="gasto">
        <input type="hidden" name="secret" class="secret-field" value="">
        <button type="submit" class="stamp-btn">Registrar gasto</button>
      </form>
    </section>

    <section class="panel hidden" id="panel-scan">
      <div class="scanner-frame">
        <div id="qr-reader"></div>
        <div class="reticle"></div>
      </div>
      <p class="scan-hint">Apunta la cámara al código del producto</p>
    </section>
  </div>
</div>

<div class="stamp-overlay" id="stampOverlay">
  <div class="stamp-mark">✔</div>
  <div class="stamp-text" id="stampText">Registrado</div>
</div>

<!-- Form + iframe ocultos: el truco clásico para mandar un POST a Apps Script
     sin toparte con problemas de CORS (un <form> normal no los tiene). -->
<form id="hiddenForm" method="POST" target="hidden_iframe" style="display:none"></form>
<iframe name="hidden_iframe" style="display:none"></iframe>

<script>
/* ============================================================
 *  CONFIGURA ESTO ANTES DE USAR
 * ============================================================ */
const CONFIG = {
  APPS_SCRIPT_URL: 'PON_AQUI_LA_URL_DE_TU_APLICACION_WEB_DE_APPS_SCRIPT',
  SECRET: 'elige-una-clave-secreta-para-tu-formulario', // debe ser IGUAL al FORM_SECRET de Code.gs
};

document.querySelectorAll('.secret-field').forEach(f => f.value = CONFIG.SECRET);
if (CONFIG.APPS_SCRIPT_URL.includes('PON_AQUI')) {
  document.getElementById('configWarning').style.display = 'block';
}

/* ---------------- Tabs ---------------- */
const tabs = document.querySelectorAll('.tab');
const panels = { venta: document.getElementById('panel-venta'), gasto: document.getElementById('panel-gasto'), scan: document.getElementById('panel-scan') };
let scanTargetId = 'sku-venta';
let scanner = null;

function showTab(name) {
  tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  Object.entries(panels).forEach(([k, el]) => el.classList.toggle('hidden', k !== name));
  if (name === 'scan') startScanner(); else stopScanner();
}
tabs.forEach(t => t.addEventListener('click', () => showTab(t.dataset.tab)));

document.querySelectorAll('.scan-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    scanTargetId = btn.dataset.target;
    showTab('scan');
  });
});

function startScanner() {
  if (scanner) return;
  scanner = new Html5Qrcode('qr-reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: 220 },
    (decodedText) => {
      document.getElementById(scanTargetId).value = decodedText;
      showTab('venta');
    },
    () => {} // ignorar frames sin código detectado
  ).catch(() => {
    document.querySelector('.scan-hint').textContent = 'No se pudo abrir la cámara. Revisa los permisos del navegador.';
  });
}
function stopScanner() {
  if (scanner) {
    scanner.stop().then(() => { scanner.clear(); scanner = null; }).catch(() => { scanner = null; });
  }
}

/* ---------------- Envío de formularios (sin CORS) ---------------- */
let submitting = false;
const hiddenForm = document.getElementById('hiddenForm');
const iframe = document.querySelector('iframe[name="hidden_iframe"]');

iframe.addEventListener('load', () => {
  if (!submitting) return; // ignora el load inicial en blanco
  submitting = false;
  showStamp();
});

function submitToSheet(form, label) {
  hiddenForm.innerHTML = '';
  hiddenForm.action = CONFIG.APPS_SCRIPT_URL;
  new FormData(form).forEach((value, key) => {
    const input = document.createElement('input');
    input.type = 'hidden';
    input.name = key;
    input.value = value;
    hiddenForm.appendChild(input);
  });
  submitting = true;
  document.getElementById('stampText').textContent = label;
  hiddenForm.submit();
}

document.getElementById('form-venta').addEventListener('submit', (e) => {
  e.preventDefault();
  submitToSheet(e.target, 'Venta registrada');
  e.target.reset();
  e.target.querySelector('[name="cantidad"]').value = 1;
});

document.getElementById('form-gasto').addEventListener('submit', (e) => {
  e.preventDefault();
  submitToSheet(e.target, 'Gasto registrado');
  e.target.reset();
});

function showStamp() {
  const overlay = document.getElementById('stampOverlay');
  overlay.classList.add('show');
  setTimeout(() => overlay.classList.remove('show'), 1100);
}
</script>
</body>
</html>
